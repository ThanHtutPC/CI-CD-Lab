name: flask CI pipeline
on: 
  push:
    branches: [ mains ]
  pull_request:
    branches: [ mains ]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: flask-curd-app
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/checkout@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip 
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest
